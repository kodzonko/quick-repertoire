name: Rust Test Suite

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  tests:
    name: Tests (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            coverage: true
          - runner: windows-latest
            coverage: false
          - runner: macos-15
            coverage: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref }}
      - name: Install Rust toolchain
        uses: jdx/mise-action@v5.2.8
      - name: Run test suite with coverage
        if: matrix.coverage
        shell: bash
        run: |
          set -o pipefail
          output_file="$(mktemp)"

          cargo llvm-cov --locked --all-targets --all-features | tee "$output_file"

          {
            echo "## Coverage"
            echo
            echo '```text'
            cat "$output_file"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          cargo llvm-cov report --lcov --output-path target/lcov.info
      - name: Upload coverage to Codecov
        if: matrix.coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: target/lcov.info
          disable_search: true
          fail_ci_if_error: true
          use_oidc: true
      - name: Run test suite
        if: ${{ !matrix.coverage }}
        run: cargo test --locked --all-targets --all-features
