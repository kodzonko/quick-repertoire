name: Live scraper checks

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium
      - name: Check TMDB credential
        run: test -n "$TMDB_ACCESS_TOKEN" || { echo 'Set the TMDB_ACCESS_TOKEN repository secret'; exit 1; }
      - name: Check live cinema and TMDB data
        run: cargo test --locked --test live_e2e -- --ignored --test-threads=1
